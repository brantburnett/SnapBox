name: Release

on:
  push:
    tags:
      - v*
      - V*

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.values }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        uses: CenterEdge/actions/dotnet/nuget-version@main
        with:
          tag-prefix: '[vV]'

      - id: platforms
        shell: pwsh
        run: |
          [xml]$solution = Get-Content -Raw SnapBox.slnx
          $platforms = @($solution.Solution.Configurations.Platform | ForEach-Object Name | Sort-Object -Unique)

          if ($platforms.Count -eq 0) {
            throw "SnapBox.slnx does not declare any build platforms."
          }

          "values=$(ConvertTo-Json -InputObject $platforms -Compress)" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        uses: CenterEdge/actions/dotnet/nuget-version@main
        with:
          tag-prefix: '[vV]'

      - uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false

      - uses: microsoft/setup-msbuild@v3

      - name: Restore vcpkg dependencies
        shell: pwsh
        run: vcpkg install --triplet "${{ matrix.platform }}-windows-static"

      - name: Build installer
        shell: pwsh
        run: msbuild SnapBox.slnx /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} "/p:Version=${{ steps.version.outputs.version }}"

      - name: Archive installer
        uses: actions/upload-artifact@v7
        with:
          name: snapbox-installer-${{ matrix.platform }}
          path: SnapBoxInstall\bin\**\*.msi
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build
    runs-on: windows-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: snapbox-installer-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SnapBox ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release\*.msi
